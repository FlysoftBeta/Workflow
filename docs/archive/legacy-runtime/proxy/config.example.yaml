# Copy to .workspace/.workflow/proxy/config.yaml and add your own providers/groups.
# Set the same strong secret in controller.json. The app never rewrites this file.
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
secret: REPLACE_WITH_A_RANDOM_SECRET
ipv6: false

tun:
  enable: true
  device: workflow-tun
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

dns:
  enable: true
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  nameserver:
    - https://1.1.1.1/dns-query

proxies: []
proxy-groups: []
rules:
  - MATCH,DIRECT
